name: guanlanai-prod

services:
  bot:
    image: ${IMAGE:-guanlanai:latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    environment:
      APP_ENV: prod
      INSTANCE_NAME: guanlanai-prod
      DATABASE_PATH: /data/guanlanai.db
      HTTP_ADDR: ":8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.21.3
    user: "473:473"
    command:
      - run
      - --disable-reporting
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      APP_ENV: prod
      INSTANCE_NAME: guanlanai-prod
      GRAFANA_CLOUD_REMOTE_WRITE_URL: ${GRAFANA_CLOUD_REMOTE_WRITE_URL:-}
      GRAFANA_CLOUD_METRICS_USERNAME: ${GRAFANA_CLOUD_METRICS_USERNAME:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
    volumes:
      - ../monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.15
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy-data:
