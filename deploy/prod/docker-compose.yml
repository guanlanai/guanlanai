name: guanlanai-prod

services:
  bot:
    image: ${IMAGE:-guanlanai:latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    environment:
      APP_ENV: prod
      INSTANCE_NAME: guanlanai-prod
      DATABASE_PATH: /data/guanlanai.db
      HTTP_ADDR: ":8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
